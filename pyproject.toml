[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aftershock"
version = "0.1.0"
description = "Crash-test an agent and check it never charges, emails or writes anything twice."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aftershock = "aftershock.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["aftershock*"]

[tool.setuptools.package-data]
aftershock = ["demo/*.json", "demo/agents/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
