[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aftershock"
version = "0.2.0"
description = "Crash-test an agent and check it never charges, emails or writes anything twice."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["agents", "testing", "fault-injection", "idempotency", "llm", "reliability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/patkusch/aftershock"
Issues = "https://github.com/patkusch/aftershock/issues"
Changelog = "https://github.com/patkusch/aftershock/blob/main/CHANGELOG.md"

[project.scripts]
aftershock = "aftershock.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "ruff>=0.17.6"]

[tool.setuptools.packages.find]
include = ["aftershock*"]

[tool.setuptools.package-data]
aftershock = ["demo/*.json", "demo/agents/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
